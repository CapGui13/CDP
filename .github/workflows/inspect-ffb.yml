name: Diagnostic FFB CDP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur
        run: node --test tests/*.test.mjs
      - name: Vérifier les secrets et lire le schéma FFB
        env:
          FFB_EMAIL: ${{ secrets.FFB_EMAIL }}
          FFB_PASSWORD: ${{ secrets.FFB_PASSWORD }}
          FFB_FIREBASE_API_KEY: ${{ secrets.FFB_FIREBASE_API_KEY }}
        run: node scripts/inspect-ffb.mjs
