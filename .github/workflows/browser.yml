name: CDP - recette navigateur
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cdp-server.log 2>&1 &
          node tests/browser-recipe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdp-recette-navigateur
          path: browser-report/
